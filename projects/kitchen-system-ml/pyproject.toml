[project]
name = "ml-project"
version = "0.1.0"
description = "Machine learning project workspace"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

